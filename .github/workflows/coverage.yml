name: coverage

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Coverage runs on main only so pull requests get the fast gate.
# --min is a ratcheting floor: raise it toward the actual reported coverage as
# the suite grows. It guards against large regressions. Reported 94.9% at the
# time it was set to 90, lowered to 80 when the suite dropped the tests that
# re-proved use-lock/server and Lattice behaviour.
# The driver is pcov, not xdebug: xdebug's line-by-line instrumentation pushed
# this past its timeout as the suite grew, and separately hung the whole job
# when it collided with the browser plugin's in-process fiber server on PHP 8.5.
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-test-env
        with:
          coverage: pcov

      - name: Tests with coverage
        timeout-minutes: 10
        run: php artisan test --compact --parallel --coverage --min=80 --coverage-clover=coverage.clover.xml --exclude-testsuite Browser

      # Uploaded even when the --min floor fails, so a regression can be
      # inspected without re-running the job.
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-clover
          path: coverage.clover.xml
          if-no-files-found: ignore
